name: Actualizar precios (SEPA)

on:
  schedule:
    - cron: "5 6 * * *"     # todos los días 03:05 de Argentina (deja agendado hoy y mañana)
  workflow_dispatch: {}      # botón para correrlo a mano

permissions:
  contents: write

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar SEPA, curar productos y agendar el del día
        run: python scripts/actualizar_precios.py
      - name: Guardar cambios
        run: |
          git config user.name "precios-bot"
          git config user.email "precios-bot@users.noreply.github.com"
          git add data/productos.json data/candidatos.json data/historial.json
          git diff --cached --quiet || git commit -m "Precios del día"
          git push

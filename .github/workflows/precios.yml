name: Actualizar precios (SEPA)

on:
  schedule:
    - cron: "23 15 * * *"   # todos los días 12:23 de Argentina
  workflow_dispatch: {}      # botón para correrlo a mano

permissions:
  contents: write

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar SEPA y generar data/productos.json
        run: python scripts/actualizar_precios.py
      - name: Guardar cambios
        run: |
          git config user.name "precios-bot"
          git config user.email "precios-bot@users.noreply.github.com"
          git add data/productos.json
          git diff --cached --quiet || git commit -m "Precios del día"
          git push

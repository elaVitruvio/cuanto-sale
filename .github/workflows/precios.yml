name: Actualizar precios (SEPA)

on:
  schedule:
    - cron: "5 6,12 * * *"   # 03:05 y 09:05 de Argentina (la 2ª cubre si falla la 1ª; deja agendado hoy y los 7 días siguientes)
  workflow_dispatch: {}      # botón para correrlo a mano

permissions:
  contents: write

concurrency:               # nunca dos corridas a la vez
  group: precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar SEPA, curar productos y agendar el del día
        run: python scripts/actualizar_precios.py
      - name: Guardar cambios
        run: |
          git config user.name "precios-bot"
          git config user.email "precios-bot@users.noreply.github.com"
          git add data/productos.json data/candidatos.json data/historial.json data/libres.json
          git diff --cached --quiet && exit 0
          git commit -m "Precios del día"
          for i in 1 2 3; do git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push && exit 0; sleep 15; done; exit 1
